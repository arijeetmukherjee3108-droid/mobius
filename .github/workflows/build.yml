name: build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project
        run: pip install .

      - name: Install test tools
        run: pip install pytest

      - name: Build site
        run: mobius build

      - name: Run tests
        run: pytest